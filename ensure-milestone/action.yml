name: "ensure-milestone"
description: "Creates a milestone in a repository if it has none of that title, and sets its due date if one is given"

inputs:
  repository:
    description: "The repository (owner/repo) that has to have the milestone."
    required: true
  milestone:
    description: "The title of the milestone, for example `7.0.1`."
    required: true
  due-date:
    description: "The due date of the milestone, YYYY-MM-DD, at noon UTC. A milestone that is due another day, or has none, is changed to it. Without it, a milestone that exists is not changed, and one that is created has none."
    required: false
  token:
    description: "A token that may write the milestones of the repository."
    required: true

outputs:
  created:
    description: "true if the milestone was created, false if the repository had it already (open or closed)."
  changed:
    description: "true if the due date of a milestone that existed was changed to due-date."
  milestone-url:
    description: "The URL of the milestone on GitHub."

runs:
  using: "node24"
  main: "dist/index.js"
