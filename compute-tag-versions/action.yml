name: "compute-tag-versions"
description: "Works out the base version, the generation and whether it is a hotfix, from the tag of a version"

inputs:
  tag:
    description: "The tag, which is the release version, for example 7.0.1, 7.0.1.1 (a hotfix), 7.1.0-M2 or 7.1.0-RC1"
    required: true

outputs:
  release-version:
    description: "The tag, for example 7.0.1 or 7.1.0-RC1"
  base-version:
    description: "The release version without its -M<n> or -RC<n>, for example 7.1.0. The snapshot version is made from it"
  generation:
    description: "The generation, <major>.<minor>.x, for example 7.0.x for 7.0.1 and for the hotfix 7.0.1.1"
  hotfix:
    description: "true if the version has a fourth number, as 7.0.1.1 has, and false otherwise"

runs:
  using: "node24"
  main: "dist/index.js"
