name: "push-branches"
description: "Pushes branches at once, or none (git push --atomic --force), and summarizes them"

inputs:
  branches:
    description: "The branches, as `branch=version`, one per line. The version is for the summary."
    required: true
  base:
    description: "The commit that was pushed. The branches were started at it, so what the run made on them is what comes after it, and the summary says how they were created from that."
    required: false
  remote:
    description: "The remote to push to."
    required: false
    default: "origin"
  title:
    description: "The title of the summary."
    required: false
  milestone-url:
    description: "The URL of the milestone of the release. The version of a branch that is not a snapshot (-SNAPSHOT) links to it in the summary."
    required: false
  train:
    description: "The name of the release train that was used, for example 2026.11.19. The summary says so. Leave it out if none was."
    required: false
  train-url:
    description: "The URL of the branch of that release train. The text of the summary line links to it."
    required: false
  train-status:
    description: "Where the release is in the train: not-joined, joined or ready, the output status of check-not-ready. The summary says so after the train."
    required: false
  train-state:
    description: "The state of the train itself, the output train-state of check-not-ready. The summary says so after the train."
    required: false
  train-state-url:
    description: "The URL of the line of train.yml with that state. The state links to it."
    required: false
  kind:
    description: "frozen, active or lts, the output kind of plan-release-branches. For active (a hotfix) the summary says how the merges of the branches that it is based on went."
    required: false
  oss-repository:
    description: "The OSS repository (owner/repo), read from the server of the workflow, for example spring-projects/spring-security. The commits that it lacks are the ones that the summary lists. Leave it out to list the commits that the run made on the pushed commit instead."
    required: false
  oss-url:
    description: "The address git fetches OSS from, if it is not the repository on the server. For a test."
    required: false
  oss-branch:
    description: "The branch of the OSS repository that the generation is in (7.0.x), the output oss-branch of plan-release-branches. A frozen or long-term support branch is compared with it."
    required: false
  oss-tag:
    description: "For a hotfix, the tag that OSS has once the release it fixes is public (7.0.9), the output oss-tag of plan-release-branches. Until there is one, the hotfix is compared with the branch it is based on."
    required: false
  snapshot-of:
    description: "For a hotfix, the branch that its snapshot is based on (embargoed/7.0.9-INTERNAL-SNAPSHOT), the output hotfix-of-snapshot of plan-release-branches."
    required: false
  release-of:
    description: "For a hotfix, the branch that its release is based on (release/7.0.9), the output hotfix-of-release of plan-release-branches."
    required: false
  merged-snapshot:
    description: "The output merged of merge-release for the snapshot branch of a hotfix: true, false (there was no such branch) or up-to-date. The summary says so."
    required: false
  merged-release:
    description: "The output merged of merge-release for the release branch of a hotfix: true, false (there was no such branch) or up-to-date. The summary says so."
    required: false
  path:
    description: "The directory of the git repository."
    required: false
    default: "."

runs:
  using: "node24"
  main: "dist/index.js"
