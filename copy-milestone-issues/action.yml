name: "copy-milestone-issues"
description: "Copies the issues and the pull requests of a milestone of a repository to another repository, as issues without their body, and comments on each original with the link to its copy"

inputs:
  source-repository:
    description: "The repository (owner/repo) that has the milestone, whose issues and pull requests are copied. Each one gets a comment with the link to its copy."
    required: true
  destination-repository:
    description: "The repository (owner/repo) that the issues are copied to. It needs a milestone of the same title, which is never created. A label that it lacks is created, and a user that cannot be assigned in it is left out."
    required: true
  milestone:
    description: "The title of the milestone in both repositories, for example `7.0.1`."
    required: true
  dry-run:
    description: "true to write nothing and say, in the summary, what would be copied, with the labels that would be created."
    required: false
    default: "false"
  token:
    description: "A token that can read and comment on the issues and the pull requests of the source repository, and write the issues of the destination repository."
    required: true

outputs:
  copied:
    description: "The number of issues and pull requests that were copied."
  skipped:
    description: "The number of issues and pull requests that were not copied, as their original has the comment with the link to a copy already."

runs:
  using: "node24"
  main: "dist/index.js"
